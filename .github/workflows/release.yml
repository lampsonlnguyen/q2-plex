name: Publish Plex Music v1.0.2

on:
  workflow_run:
    workflows: ["Test and build Q2 Plex"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-q2-plex-v1.0.2
  cancel-in-progress: false

jobs:
  publish:
    # Release only a successful main-branch PUSH (never a PR or a fork).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check that this exact commit is main and version 1.0.2
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          grep -F 'const version = "1.0.2"' cmd/q2-plex/main.go
          grep -F 'q2-plex-v1.0.2.zip' contrib/shanlingq2/build.sh
      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.existing.outputs.exists == 'false'
        with:
          go-version-file: go.mod
      - name: Unit tests
        if: steps.existing.outputs.exists == 'false'
        run: go test ./...
      - name: Build installable MIPS package
        if: steps.existing.outputs.exists == 'false'
        run: ./contrib/shanlingq2/build.sh
      - name: Validate package and icons
        if: steps.existing.outputs.exists == 'false'
        run: python3 contrib/shanlingq2/verify_release.py dist/q2-plex-v1.0.2.zip
      - name: Produce SHA256 checksums
        if: steps.existing.outputs.exists == 'false'
        run: cd dist && sha256sum q2-plex-v1.0.2.zip > SHA256SUMS
      - name: Publish release and Git tag
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create v1.0.2 \
            dist/q2-plex-v1.0.2.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Plex Music v1.0.2 for Q2 Pod" \
            --notes-file docs/RELEASE-v1.0.2.md \
            --latest
